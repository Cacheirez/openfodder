name: Windows - modernization foundation

on:
  push:
    branches: ['modernization/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get pinned replay fixtures
        run: |
          git clone https://github.com/OpenFodder/tests.git Run/Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C Run/Tests checkout c7722ef1a37c1e04ff28c6fedf9d3bdff197dc86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: H5.5 - screen transform mathematical contract
        run: python tools/modernization/check_screen_transform_contract.py
      - name: Test the audit gate
        run: python -m unittest discover -s tools/modernization -v
      - name: H3.6 - verify the legacy visibility contract
        run: python tools/modernization/check_visibility_contract.py
      - name: H2.3 - verify actual sprite frame metadata
        run: python tools/modernization/check_sprite_table_lengths.py
      - name: Configure Windows x64
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 -DOPENFODDER_ENABLE_FFMPEG=OFF
      - name: Build
        run: cmake --build build-win --config Release --parallel 4
      - name: H2.3 - direction lookup boundary tests
        run: ctest --test-dir build-win -C Release --output-on-failure
      - name: H5.5 - fitted mission pause and resumed inverse with original H3
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: python tools/modernization/check_mission_publication_replays.py --exe Run/openfodder.exe --data Run --out reports/h5-screen-transform --screen-probe --pause-probe --first-phase
      - name: Replay all available demos and compare completion outcomes
        run: python tools/modernization/audit_replays.py --exe Run/openfodder.exe --data Run --out reports/windows --timeout 600 --baseline tools/modernization/reference-completion.json
      - name: H3 - compare two real PC Format gameplay traces
        run: python tools/modernization/verify_gameplay_determinism.py --exe Run/openfodder.exe --data Run --campaign "PC Format" --out reports/h3-pc --timeout 600
      - name: H3 - compare two real Amiga The One gameplay traces
        run: python tools/modernization/verify_gameplay_determinism.py --exe Run/openfodder.exe --data Run --campaign "Amiga The One" --out reports/h3-amiga --timeout 600
      - name: H3 - compare with pinned pre-stabilization gameplay baseline
        run: python tools/modernization/check_gameplay_baseline.py --baseline tools/modernization/reference-gameplay-v1.json --traces reports/h3-pc/run1/traces reports/h3-amiga/run1/traces
      - name: H4.2 - semantic soldier original graphics and bounded pause
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          foreach ($count in 0, 1, 5) {
            python tools/modernization/check_mission_publication_replays.py --exe Run/openfodder.exe --data Run --out "reports/h4-soldier-$count" --soldier-probe --presentations $count --pause-probe --first-phase
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: H4.4 - individual original pose and bounded pause
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          foreach ($count in 0, 1, 5) {
            python tools/modernization/check_mission_publication_replays.py --exe Run/openfodder.exe --data Run --out "reports/h4-pose-$count" --pose-probe --presentations $count --pause-probe --first-phase
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: H6.3 - C01 RGBA selected pose with original H3
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: python tools/modernization/check_mission_publication_replays.py --exe Run/openfodder.exe --data Run --out reports/h6-art-full --art-probe
      - name: Prepare playable demo package
        run: python tools/modernization/stage_windows.py --out dist/OpenFodder --report reports/windows/report.json
      - name: Upload Windows demo build
        uses: actions/upload-artifact@v4
        with:
          name: OpenFodder-Windows-x64-demos
          path: dist/OpenFodder/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenFodder-Windows-test-evidence
          path: |
            reports/
            build-win/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 30
